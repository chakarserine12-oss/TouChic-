<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TouChic</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#1f2a63;--navy-d:#141c45;--champ:#e9dcc3;--paper:#faf7f1;--ink:#1b1f33;--mute:#6b6f85;--line:#ddd5c4;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;background:var(--paper);border-bottom:1px solid var(--line)}
.hl{height:46px;width:auto;display:block}
.alogo{display:block;width:min(100%,340px);height:auto;margin:0 auto 14px}
.top button{background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
main{max-width:460px;margin:0 auto;padding:24px 20px 110px}
h1{font-size:24px;margin:8px 0 4px}p.sub{color:var(--mute);margin:0 0 20px}
label{display:block;font-weight:500;margin:14px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus,textarea:focus,textarea:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--navy);font:inherit;text-decoration:underline;cursor:pointer;margin-top:16px;padding:0}
.msg{margin-top:14px;color:var(--err);min-height:20px}.msg.ok{color:#1e6b3a}
.roles{display:grid;gap:10px;margin-top:6px}
.role{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:start;font:inherit;width:100%}
.role.on{border-color:var(--navy);background:#eef0fa}
.scs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.sc{padding:0;border:3px solid transparent;border-radius:16px;background:none;cursor:pointer;overflow:hidden}
.sc img{display:block;width:100%;height:auto;border-radius:12px}
.sc.on{border-color:var(--navy)}
.fcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.fc{padding:0;border:2px solid transparent;border-radius:10px;background:#fff;cursor:pointer;overflow:hidden;font:inherit}
.fc img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.fn{display:block;font-size:11px;line-height:1.25;padding:3px 2px 1px;color:var(--ink);text-align:center}
.fc.on{border-color:var(--navy)}
.fp{display:block;padding:0 2px 3px;font-size:10px;color:var(--mute);text-align:center}
.role span.i{font-size:24px}.role small{display:block;color:var(--mute)}
.hello{background:var(--navy);color:#fff;border-radius:16px;padding:22px;margin-bottom:18px}
.hello h1{margin:0 0 4px}.hello .tag{display:inline-block;background:var(--champ);color:var(--navy-d);border-radius:20px;padding:2px 12px;font-weight:700;font-size:14px}
.item{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
.soon{font-size:13px;color:var(--mute);background:#efe9db;border-radius:20px;padding:2px 10px}
.pay{margin-top:22px;border:1.5px dashed var(--navy);border-radius:12px;padding:14px;background:#fff}
.pay div{display:flex;justify-content:space-between;padding:4px 0}.pay .t{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.pay em{font-style:normal;font-size:13px;color:var(--mute)}
textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;min-height:90px;resize:vertical}
h2{font-size:18px;margin:26px 0 6px}
.ord{padding:14px 4px;border-bottom:1px solid var(--line)}.ord b{display:block}
.ord p{margin:4px 0;color:var(--mute);font-size:14px;white-space:pre-wrap}
.st{display:inline-block;background:var(--champ);color:var(--navy-d);border-radius:20px;padding:2px 12px;font-size:13px;font-weight:700}
.btn.sm{width:auto;margin-top:8px;padding:8px 16px}
.empty{color:var(--mute);padding:14px 4px}
h2{font-size:18px;margin:26px 0 8px}
textarea{min-height:90px;resize:vertical}
.ord{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.ord p{margin:6px 0;color:var(--mute);white-space:pre-wrap}
.ord .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{background:var(--champ);color:var(--navy-d);border-radius:20px;padding:2px 12px;font-size:14px;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ms{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 18px;border:1.5px solid var(--line);border-radius:20px;background:#fff;font:inherit;cursor:pointer}
.chip.on{border-color:var(--navy);background:#eef0fa;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav[hidden]{display:none}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;cursor:pointer}
nav button.on{color:var(--navy);font-weight:700}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.pic{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.stp{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mute)}
.stp.done{background:#e3e7f7;color:var(--navy);border-color:#e3e7f7}
.stp.cur{background:var(--navy);color:#fff;font-weight:700;border-color:var(--navy)}
.note{background:#efe9db;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.tap{cursor:pointer}
.note .row{display:flex;justify-content:space-between;gap:12px}
.hero{border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 6px 18px rgba(20,28,69,.18)}.hero svg{display:block;width:100%;height:auto}
.gbtn{width:100%;margin-top:12px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin-top:14px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>

<main id="app"></main>
<nav id="nav" hidden></nav>

let lang = localStorage.getItem("lang") || "ar";
let tab = "home";
let mode = "login", pickedRole = null, session = null, profile = null;
const $ = s => document.querySelector(s);
const t = k => T[lang][k];
const ROLES = [["client","🛍️"],["designer","✏️"],["tailor","🧵"]];

function setLang(l){lang=l;localStorage.setItem("lang",l);document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";render();}
$("#lang").onclick = () => setLang(lang==="ar"?"fr":"ar");


function roleCards(){
  return `<div class="roles">`+ROLES.map(([r,i])=>
   `<button type="button" class="role ${pickedRole===r?"on":""}" data-r="${r}"><span class="i">${i}</span><span><b>${t(r)}</b><small>${t(r+"_d")}</small></span></button>`).join("")+`</div>`;
}
function bindRoles(){document.querySelectorAll(".role").forEach(b=>b.onclick=()=>{pickedRole=b.dataset.r;document.querySelectorAll(".role").forEach(x=>x.classList.toggle("on",x===b));});}
const msg = (txt,ok)=>{const m=$("#msg");m.textContent=txt||"";m.className="msg"+(ok?" ok":"");};

function viewAuth(){
  const reg = mode==="register";
  $("#app").innerHTML = `
   <img class="alogo" src="${LOGO}" alt="TouChic">
   ${hero()}<h1>${reg?t("register"):t("login")}</h1><p class="sub">${reg?t("sub_reg"):t("sub_login")}</p>
   ${reg?`<label>${t("name")}</label><input id="name" autocomplete="name">`:""}
   <label>${t("email")}</label><input id="email" type="email" autocomplete="email" dir="ltr">
   <label>${t("pass")}</label><input id="pass" type="password" autocomplete="${reg?"new-password":"current-password"}" dir="ltr">
   ${reg?`<label>${t("role")}</label>${roleCards()}`:""}
   <button class="btn" id="go">${reg?t("register"):t("login")}</button>
   <div class="or">${t("or")}</div>
   <button class="gbtn" id="gg" type="button"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span>${t("google")}</span></button>
   <div class="msg" id="msg"></div>
   ${reg?"":`<button class="link" id="fp">${t("forgot")}</button><br>`}
   <button class="link" id="sw">${reg?t("has_acc"):t("no_acc")}</button>`;
  $("#gg").onclick=async()=>{const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:HOME}});if(error) msg(t("e_google"));};
  if($("#fp")) $("#fp").onclick=viewForgot;
  if(reg) bindRoles();
  $("#sw").onclick=()=>{mode=reg?"login":"register";render();};
  $("#go").onclick=async()=>{
    const email=$("#email").value.trim(), pass=$("#pass").value;
    if(!email||!pass) return msg(t("err_fill"));
    $("#go").disabled=true; msg(t("wait"),true);
    if(!reg){
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      $("#go").disabled=false; if(error) return msg(error.message);
      return boot();
    }
    const name=$("#name").value.trim();
    if(!name) {$("#go").disabled=false;return msg(t("err_fill"));}
    if(!pickedRole){$("#go").disabled=false;return msg(t("err_role"));}
    const {data,error}=await sb.auth.signUp({email,password:pass});
    $("#go").disabled=false;
    if(error) return msg(error.message);
    if(!data.session){ mode="login"; render(); return msg(t("check_mail"),true); }
    const {error:e2}=await sb.from("profiles").insert({id:data.user.id,full_name:name,role:pickedRole});
    if(e2) return msg(e2.message);
    boot();
  };
}

function viewForgot(){
  $("#app").innerHTML=`<img class="alogo" src="${LOGO}" alt="TouChic"><h1>${t("fp_t")}</h1><p class="sub">${t("fp_sub")}</p>
   <label>${t("email")}</label><input id="email" type="email" autocomplete="email" dir="ltr">
   <button class="btn" id="go">${t("fp_send")}</button><div class="msg" id="msg"></div>
   <button class="link" id="bk">${t("o_back")}</button>`;
  $("#bk").onclick=()=>{mode="login";render();};
  $("#go").onclick=async()=>{
    const email=$("#email").value.trim(); if(!email) return msg(t("err_fill"));
    $("#go").disabled=true; msg(t("wait"),true);
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:HOME});
    $("#go").disabled=false;
    if(error) return msg(/rate|seconds/i.test(error.message)?t("e_rate"):error.message);
    msg(t("fp_sent"),true);
  };
}

function viewNewPass(){
  $("#nav").hidden=true;
  $("#app").innerHTML=`<img class="alogo" src="${LOGO}" alt="TouChic"><h1>${t("np_t")}</h1>
   <label>${t("np_new")}</label><input id="p1" type="password" autocomplete="new-password" dir="ltr">
   <label>${t("np_rep")}</label><input id="p2" type="password" autocomplete="new-password" dir="ltr">
   <button class="btn" id="go">${t("np_btn")}</button><div class="msg" id="msg"></div>`;
  $("#go").onclick=async()=>{
    const a=$("#p1").value, b=$("#p2").value;
    if(a.length<6) return msg(t("np_short"));
    if(a!==b) return msg(t("np_same"));
    $("#go").disabled=true; msg(t("wait"),true);
    const {error}=await sb.auth.updateUser({password:a});
    if(error){$("#go").disabled=false;return msg(error.message);}
    recovering=false; history.replaceState(null,"",HOME); boot();
  };
}

function viewRolePick(){
  $("#app").innerHTML=`<h1>${t("choose")}</h1><p class="sub"></p>${roleCards()}
   <button class="btn" id="go">${t("save")}</button><div class="msg" id="msg"></div>`;
  bindRoles();
  $("#go").onclick=async()=>{
    if(!pickedRole) return msg(t("err_role"));
    const {error}=await sb.from("profiles").insert({id:session.user.id,full_name:((session.user.user_metadata||{}).full_name||(session.user.user_metadata||{}).name||session.user.email),role:pickedRole});
    if(error) return msg(error.message);
    boot();
  };
}

const SHOW_DEP=false; // mettre true quand le montant de l'acompte est décidé
let FAB_PRICE={}, FAB_LOADED=false;
const fabPrice=k=>FAB_PRICE[k]!=null?`<small class="fp">${money(FAB_PRICE[k])} / ${t("per_m")}</small>`:"";
const fabCard=(k,on)=>`<button type="button" class="fc ${on?"on":""}" data-k="${k}" aria-label="${t("fab_"+k)}"><img src="${FAB_IMG[k]}" alt="${t("fab_"+k)}"><span class="fn">${t("fab_"+k)}</span>${fabPrice(k)}</button>`;
async function loadFabPrices(){
  if(FAB_LOADED) return; FAB_LOADED=true;
  try{
    const {data}=await sb.from("fabric_prices").select("*");
    (data||[]).forEach(r=>{if(r.price_per_meter!=null) FAB_PRICE[r.key]=Number(r.price_per_meter);});
    document.querySelectorAll(".fc").forEach(b=>{const k=b.dataset.k;if(FAB_PRICE[k]!=null&&!b.querySelector(".fp")) b.insertAdjacentHTML("beforeend",fabPrice(k));});
  }catch(e){FAB_LOADED=false;}
}
const GEN=["man","woman","child"];
const DEP={traditional:4000,classic:3000,modern:2000,everyday:1500}, COMM=0.05;
const MS=[["height","m_h"],["chest","m_c"],["waist","m_w"],["hips","m_hp"],["arm_length","m_a"]];
const FLOW=["awaiting_designer","in_design","awaiting_client_approval","awaiting_tailor","in_execution","ready","shipped","delivered"];
const money=n=>`<bdi dir="ltr">${Number(n).toLocaleString("fr-FR")} DA</bdi>`;
const stepper=st=>{const i=FLOW.indexOf(st);return `<div class="steps">${FLOW.map((k,j)=>`<span class="stp ${j<i?"done":j===i?"cur":""}">${t("st_"+k)}</span>`).join("")}</div>`;};
const card=(o,tag)=>`<div class="ord tap" data-id="${o.id}"><b>${esc(o.title)}</b><p>${esc(o.description)}</p><div class="row"><span>${o.style?t("sty_"+o.style):""}${tag?" · "+esc(tag):""}</span><span class="st">${t("st_"+o.status)}</span></div></div>`;
const bindCards=box=>box.querySelectorAll(".tap").forEach(c=>c.onclick=()=>viewOrder(c.dataset.id));

async function loadOrders(box,emptyKey,lim){
  let q=sb.from("orders").select("*").order("created_at",{ascending:false}); if(lim) q=q.limit(lim);
  const {data,error}=await q;
  if(error){box.innerHTML=`<p class="msg">${esc(error.message)}</p>`;return;}
  if(!data.length){box.innerHTML=`<p class="sub">${t(emptyKey)}</p>`;return;}
  box.innerHTML=data.map(o=>card(o)).join(""); bindCards(box);
}

async function loadWork(box,r){
  const {data,error}=await sb.from("orders").select("*").order("created_at",{ascending:false});
  if(error){box.innerHTML=`<p class="msg">${esc(error.message)}</p>`;return;}
  const {data:offs}=await sb.from("offers").select("order_id").eq("provider_id",session.user.id);
  const sent=new Set((offs||[]).map(x=>x.order_id));
  const mine=data.filter(o=>o[r+"_id"]===session.user.id);
  const openSt=r==="designer"?"awaiting_designer":"awaiting_tailor";
  const open=data.filter(o=>o.status===openSt&&!o[r+"_id"]);
  const sec=(h,list,empty,tagFn)=>`<h2>${t(h)}</h2>`+(list.length?list.map(o=>card(o,tagFn?tagFn(o):"")).join(""):`<p class="sub">${t(empty)}</p>`);
  box.innerHTML=sec(r==="designer"?"d1":"t1",open,"empty_d",o=>sent.has(o.id)?t("sent_tag"):"")+sec("mine_h",mine,"empty_m");
  bindCards(box);
}

function shrink(file,max=1600,q=.82){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("image")),"image/jpeg",q);};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("image"));};im.src=u;});}
async function upFile(file,orderId,tag){
  const blob=await shrink(file);
  const path=`${orderId}/${Date.now()}-${tag}.jpg`;
  const {error}=await sb.storage.from("designs").upload(path,blob,{contentType:"image/jpeg"});
  if(error) throw error;
  return sb.storage.from("designs").getPublicUrl(path).data.publicUrl;
}

async function offersUI(o,kind){
  const box=$("#offs"); let key="price";
  const {data,error}=await sb.from("offers").select("*").eq("order_id",o.id).eq("kind",kind);
  if(error){box.innerHTML=`<p class="msg">${esc(error.message)}</p>`;return;}
  const draw=()=>{
    const list=[...(data||[])].sort((a,b)=>Number(a[key])-Number(b[key]));
    box.innerHTML=list.length?list.map((x,i)=>`<div class="ord"><b>${esc(x.provider_name)}</b><div class="row"><span>${money(x.price)}</span><span>${dur(x.days)}</span></div><button class="btn pick" data-i="${i}" style="margin-top:10px">${t("pick")}</button></div>`).join(""):`<p class="sub">${t("of_none")}</p>`;
    box.querySelectorAll(".pick").forEach(b=>b.onclick=()=>viewPick(o,kind,list[b.dataset.i]));
  };
  document.querySelectorAll(".chip[data-s]").forEach(c=>c.onclick=()=>{key=c.dataset.s;document.querySelectorAll(".chip[data-s]").forEach(x=>x.classList.toggle("on",x===c));draw();});
  draw();
}

function payBox(o){
  const r=profile.role, row=(l,v)=>`<div class="row"><span>${l}</span><b>${v}</b></div>`;
  let h="";
  if(r==="client"){
    if(SHOW_DEP&&o.deposit) h+=row(t("pb_dep"),money(o.deposit));
    if(o.designer_price&&o.tailor_price){const tot=Number(o.designer_price)+Number(o.tailor_price);h+=row(t("pb_tot"),money(tot))+(SHOW_DEP?row(t("pb_rest"),money(Math.max(tot-(o.deposit||0),0))):"");}
  } else {
    const mine=r==="designer"?o.designer_price:o.tailor_price;
    if(mine){const c=Math.round(mine*COMM);h+=row(t("pb_mine"),money(mine))+row(t("pb_comm"),"− "+money(c))+row(t("pb_net"),money(mine-c));}
  }
  return h?`<div class="note">${h}<small>${t("dep_sim")}</small></div>`:"";
}

async function loadWallet(box){
  box.innerHTML=`<p class="sub">${t("wait")}</p>`;
  const [e,p]=await Promise.all([
    sb.from("earnings").select("*,orders(title)").order("created_at",{ascending:false}),
    sb.from("payouts").select("*").order("created_at",{ascending:false})]);
  if(e.error) return box.innerHTML=`<p class="sub">${esc(e.error.message)}</p>`;
  const ea=e.data||[], pa=p.data||[];
  const bal=ea.filter(x=>!x.payout_id).reduce((a,x)=>a+x.net,0);
  box.innerHTML=`<div class="note"><div class="row"><span>${t("w_bal")}</span><b>${money(bal)}</b></div><small>${t("w_hint")}</small></div>
   ${bal>0?`<label>${t("w_acc")}</label><input id="w_a" dir="ltr" inputmode="numeric" maxlength="40" value="${esc(profile.payout_account||"")}">
   <button class="btn" id="w_go">${t("w_req")}</button><p class="sub" style="margin-top:8px">${t("dep_sim")}</p><div class="msg" id="msg"></div>`:""}
   ${ea.length?`<h2>${t("w_hist")}</h2>`+ea.map(x=>`<div class="ord"><b>${esc(x.orders?x.orders.title:"")}</b><div class="row"><span>${t(x.role)} · ${t("pb_comm")} ${money(x.commission)}</span><b>${money(x.net)}</b></div><div class="row"><span>${x.payout_id?t("w_asked"):t("w_avail")}</span></div></div>`).join(""):`<p class="sub">${t("w_none")}</p>`}
   ${pa.length?`<h2>${t("w_pay")}</h2>`+pa.map(x=>`<div class="ord"><div class="row"><span dir="ltr">${esc(x.account)}</span><b>${money(x.amount)}</b></div><div class="row"><span>${t(x.status==="paid"?"w_paid":"w_pend")}</span></div></div>`).join(""):""}`;
  if($("#w_go")) $("#w_go").onclick=async()=>{
    const acc=$("#w_a").value.trim();
    if(acc.length<6) return msg(t("e_acc"));
    $("#w_go").disabled=true; msg(t("wait"),true);
    const {error}=await sb.rpc("request_payout",{p_account:acc});
    if(error){$("#w_go").disabled=false;return msg(errMsg(error));}
    profile.payout_account=acc; loadWallet(box);
  };
}

function viewPick(o,kind,x){
  const d=kind==="designer";
  $("#app").innerHTML=`<button class="link" id="bk" style="margin:0 0 8px">${t("o_back")}</button><h1>${t(d?"dep_t":"cf_t")}</h1>
   <div class="ord"><b>${esc(x.provider_name)}</b><div class="row"><span>${money(x.price)}</span><span>${dur(x.days)}</span></div></div>
   ${d?`<div class="note">${t("dep_note")}</div><div class="note">${t("design_def")}</div>`:""}
   <button class="btn" id="go">${t(d?"dep_btn":"cf_btn")}</button>${d?`<p class="sub" style="margin-top:8px">${t("dep_sim")}</p>`:""}<div class="msg" id="msg"></div>`;
  $("#bk").onclick=()=>viewOrder(o.id);
  $("#go").onclick=async()=>{
    $("#go").disabled=true; msg(t("wait"),true);
    const {error}=await sb.rpc(d?"choose_designer_offer":"choose_tailor_offer",{p_offer:x.id});
    if(error){$("#go").disabled=false;return msg(errMsg(error));}
    if(d){
      // Chargily test payment: ask the server function for a checkout link, then open it.
      // If anything fails, we simply continue with the existing flow.
      try{
        const {data:pay,error:payErr}=await sb.functions.invoke("clever-action",{body:{order_id:o.id}});
        if(!payErr&&pay&&pay.checkout_url){location.href=pay.checkout_url;return;}
        console.warn("checkout not created",payErr,pay);
      }catch(e){console.warn("checkout error",e);}
    }
    viewOrder(o.id);
  };
}

async function myOfferUI(o,kind){
  const box=$("#ofm");
  const {data}=await sb.from("offers").select("*").eq("order_id",o.id).eq("provider_id",session.user.id).eq("kind",kind).maybeSingle();
  if(data){
    box.innerHTML=`<div class="note"><b>${t("my_offer")}:</b> ${money(data.price)} · ${dur(data.days)}<br>${t("offer_sent")}</div>
     <div id="oe" hidden><label>${t("price")}</label><input id="ep" type="number" inputmode="decimal" min="1" dir="ltr" value="${esc(data.price)}">
     <label>${t("days")}</label><input id="ed" type="number" inputmode="numeric" min="1" step="1" dir="ltr" value="${esc(data.days)}">
     <button class="btn" id="esv">${t("offer_save")}</button></div>
     <button class="btn alt" id="eed">${t("offer_edit")}</button><button class="link" id="ecn">${t("offer_cancel")}</button>`;
    $("#eed").onclick=()=>{$("#oe").hidden=false;$("#eed").hidden=true;};
    $("#esv").onclick=async()=>{
      const price=parseFloat($("#ep").value), days=parseInt($("#ed").value,10);
      if(!(price>0)||!(days>0)) return msg(t("err_num"));
      $("#esv").disabled=true; msg(t("wait"),true);
      const {error}=await sb.rpc("update_offer",{p_offer:data.id,p_price:price,p_days:days});
      if(error){$("#esv").disabled=false;return msg(errMsg(error));}
      msg(""); myOfferUI(o,kind);
    };
    $("#ecn").onclick=async()=>{
      if(!confirm(t("offer_cancel_q"))) return;
      msg(t("wait"),true);
      const {error}=await sb.rpc("cancel_offer",{p_offer:data.id});
      if(error) return msg(errMsg(error));
      msg(""); myOfferUI(o,kind);
    };
    return;
  }
  box.innerHTML=`<h2>${t("my_offer")}</h2><label>${t("price")}</label><input id="op" type="number" inputmode="decimal" min="1" dir="ltr">
   <label>${t("days")}</label><input id="oday" type="number" inputmode="numeric" min="1" step="1" dir="ltr">
   <button class="btn" id="os">${t("send_offer")}</button>`;
  $("#os").onclick=async()=>{
    const price=parseFloat($("#op").value), days=parseInt($("#oday").value,10);
    if(!(price>0)||!(days>0)) return msg(t("err_num"));
    $("#os").disabled=true; msg(t("wait"),true);
    const {error}=await sb.from("offers").insert({order_id:o.id,kind,price,days,provider_name:profile.full_name});
    if(error){$("#os").disabled=false;return msg(errMsg(error));}
    viewOrder(o.id);
  };
}

async function viewOrder(id){
  $("#app").innerHTML=`<p class="sub">${t("wait")}</p>`;
  const {data:o,error}=await sb.from("orders").select("*").eq("id",id).maybeSingle();
  if(error||!o){$("#app").innerHTML=`<button class="link" id="bk">${t("o_back")}</button><p class="msg">${esc(error?error.message:"")}</p>`;$("#bk").onclick=viewDash;return;}
  await loadFabPrices();
  const r=profile.role, me=session.user.id, s=o.status;
  const pic=(u,k)=>u?`<h2>${t(k)}</h2><a href="${esc(u)}" target="_blank"><img class="pic" src="${esc(u)}"></a>`:"";
  const imgs=pic(o.design_url,"draw")+pic(o.pattern_url,"pat");
  const prov=(o.designer_name&&(r==="client"||o.designer_id===me)?`<div class="item"><b>${t("designer")}: ${esc(o.designer_name)}</b><span>${money(o.designer_price)} · ${dur(o.designer_days)}</span></div>`:"")
           +(o.tailor_name&&(r==="client"||o.tailor_id===me)?`<div class="item"><b>${t("tailor")}: ${esc(o.tailor_name)}</b><span>${money(o.tailor_price)} · ${dur(o.tailor_days)}</span></div>`:"");
  const noteRev=o.revision_note?`<div class="note"><b>${t("rev_note")}:</b> ${esc(o.revision_note)}</div>`:"";
  let body="", after=null;
  const act=async(name,args)=>{msg(t("wait"),true);const {error}=await sb.rpc(name,args);if(error)return msg(errMsg(error));viewOrder(o.id);};

  if(r==="client"){
    if(s==="awaiting_designer"||s==="awaiting_tailor"){
      const kind=s==="awaiting_designer"?"designer":"tailor";
      body=(kind==="designer"?`<div class="note">${t("design_def")}</div>`:imgs)+`<h2>${t(kind==="designer"?"of_t":"of_t2")}</h2>
        <div class="chips"><button class="chip on" data-s="price">${t("sort_p")}</button><button class="chip" data-s="days">${t("sort_d")}</button></div><div id="offs" style="margin-top:12px"></div>`;
      after=()=>offersUI(o,kind);
    } else if(s==="in_design") body=`<div class="note">${t("design_def")}</div><p>${t("in_design_msg")}</p>`+noteRev;
    else if(s==="awaiting_client_approval"){
      body=imgs+`<div id="revbox" hidden><label>${t("rev_note")}</label><textarea id="rv" placeholder="${t("rev_ph")}"></textarea><button class="btn alt" id="rvs">${t("rev_send")}</button></div>
        <button class="btn alt" id="rev">${t("rev_btn")}</button><button class="btn" id="ok">${t("appr_btn")}</button>`;
      after=()=>{
        $("#rev").onclick=()=>{$("#revbox").hidden=false;$("#rev").hidden=true;};
        $("#rvs").onclick=()=>{const n=$("#rv").value.trim();if(!n)return msg(t("err_fill"));act("request_revision",{p_order:o.id,p_note:n});};
        $("#ok").onclick=()=>act("approve_design",{p_order:o.id});
      };
    } else if(s==="in_execution") body=`<p>${t("exec_msg")}</p>`+imgs;
    else if(s==="ready"){
      body=`<div class="note">${t("ready_c")}</div><h2>${t("dl_t")}</h2><p class="sub">${t("dl_priv")}</p>
        <label>${t("dl_name")}</label><input id="dl_n" autocomplete="name" value="${esc(profile.full_name||"")}">
        <label>${t("dl_phone")}</label><input id="dl_p" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="05XX XX XX XX">
        <label>${t("dl_wil")}</label><input id="dl_w">
        <label>${t("dl_addr")}</label><textarea id="dl_a"></textarea>
        <button class="btn" id="dl_go">${t("dl_btn")}</button>`+imgs;
      after=()=>{$("#dl_go").onclick=()=>{
        const v=id=>$("#"+id).value.trim(), ph=v("dl_p").replace(/\D/g,"");
        if(!v("dl_n")||!v("dl_w")||v("dl_a").length<5||ph.length<9||ph.length>12) return msg(t("e_deliv"));
        act("submit_delivery",{p_order:o.id,p_name:v("dl_n"),p_phone:v("dl_p"),p_wilaya:v("dl_w"),p_address:v("dl_a")});
      };};
    }
    else if(s==="shipped"){
      body=`<div class="note">${t("ship_c")}</div><div id="dlv"></div><button class="btn" id="rcv">${t("rcv_btn")}</button><p class="sub" style="margin-top:8px">${t("dep_sim")}</p>`+imgs;
      after=async()=>{
        $("#rcv").onclick=()=>act("confirm_receipt",{p_order:o.id});
        const {data:d}=await sb.from("deliveries").select("*").eq("order_id",o.id).maybeSingle();
        if(d&&$("#dlv")) $("#dlv").innerHTML=`<div class="ord"><b>${t("dl_t")}</b><p>${esc(d.full_name)} · <bdi dir="ltr">${esc(d.phone)}</bdi><br>${esc(d.wilaya)} — ${esc(d.address)}</p></div>`;
      };
    }
    else if(s==="delivered") body=`<div class="note">${t("deliv_c")}</div>`+imgs;
    if(s==="awaiting_designer"||s==="in_design") body+=`<button class="btn" disabled style="margin-top:18px">${t("sew_lock")}</button>`;
  } else if(r==="designer"){
    if(o.designer_id===me){
      if(s==="in_design"){
        body=noteRev+`<h2>${t("up_t")}</h2><div class="note">${t("design_def")}</div>
          <label>${t("up_draw")}</label><input type="file" id="f1" accept="image/*">
          <label>${t("up_pat")}</label><input type="file" id="f2" accept="image/*">
          <button class="btn" id="up">${t("up_btn")}</button>`;
        after=()=>{$("#up").onclick=async()=>{
          const f1=$("#f1").files[0], f2=$("#f2").files[0];
          if(!f1||!f2) return msg(t("err_file"));
          $("#up").disabled=true; msg(t("wait"),true);
          try{
            const a=await upFile(f1,o.id,"drawing"), b=await upFile(f2,o.id,"pattern");
            const {error}=await sb.rpc("submit_design",{p_order:o.id,p_design:a,p_pattern:b});
            if(error) throw error;
            viewOrder(o.id);
          }catch(e){$("#up").disabled=false;msg(errMsg(e));}
        };};
      } else body=imgs+(s==="awaiting_client_approval"?`<div class="note">${t("up_wait")}</div>`:s==="delivered"?`<div class="note">${t("deliv_p")}</div>`:s==="ready"||s==="shipped"?`<div class="note">${t("after_p")}</div>`:"");
    } else if(s==="awaiting_designer"){ body=`<div id="ofm"></div>`; after=()=>myOfferUI(o,"designer"); }
  } else {
    if(o.tailor_id===me){
      body=imgs+(s==="in_execution"?`<button class="btn" id="rd">${t("ready_btn")}</button>`:s==="ready"?`<div class="note">${t("ready_p")}</div>`:s==="shipped"?`<div class="note">${t("ship_p")}</div>`:s==="delivered"?`<div class="note">${t("deliv_p")}</div>`:"");
      if(s==="in_execution") after=()=>{$("#rd").onclick=()=>act("mark_ready",{p_order:o.id});};
    } else if(s==="awaiting_tailor"){ body=imgs+`<div id="ofm"></div>`; after=()=>myOfferUI(o,"tailor"); }
  }

  $("#app").innerHTML=`<div style="display:flex;justify-content:space-between"><button class="link" id="bk" style="margin:0 0 8px">${t("o_back")}</button><button class="link" id="rf" style="margin:0 0 8px">${t("refresh")}</button></div>
    <h1>${esc(o.title)}</h1><div class="chips"><span class="st">${o.style?t("sty_"+o.style):""}</span>${o.gender?`<span class="st">${t("gen_"+o.gender)}</span>`:""}${o.age?`<span class="st">${t("o_age")}: <bdi dir="ltr">${esc(o.age)}</bdi></span>`:""}${o.season?`<span class="st">${t("sea_"+o.season)}</span>`:""}${FAB_KEYS.includes(o.fabric)?`<span class="st">${t("fab_t")}: ${t("fab_"+o.fabric)}</span>`:""}</div>
    ${(r!=="client"&&FAB_KEYS.includes(o.fabric)&&FAB_PRICE[o.fabric]!=null)?`<div class="note">${t("fab_pm")} (${t("fab_"+o.fabric)}): ${money(FAB_PRICE[o.fabric])}</div>`:""}
    <p class="sub" style="margin-top:10px">${esc(o.description)}</p>${pic(o.ref_image_url,"o_ref_t")}
    <p class="ms">${MS.map(([k,l])=>`${t(l)}: <b>${esc(o[k]??"—")}</b>`).join(" · ")}</p>
    ${stepper(s)}${payBox(o)}${prov}${body}<div class="msg" id="msg"></div>`;
  $("#bk").onclick=viewDash;
  $("#rf").onclick=()=>viewOrder(o.id);
  if(after) after();
}

  document.querySelectorAll("#gen .chip").forEach(b=>b.onclick=()=>{pickedGen=b.dataset.k;document.querySelectorAll("#gen .chip").forEach(x=>x.classList.toggle("on",x===b));});
  document.querySelectorAll("#sea .chip").forEach(b=>b.onclick=()=>{pickedSea=b.dataset.k;document.querySelectorAll("#sea .chip").forEach(x=>x.classList.toggle("on",x===b));});
  document.querySelectorAll("#fab .fc").forEach(b=>b.onclick=()=>{const was=b.classList.contains("on");document.querySelectorAll("#fab .fc").forEach(x=>x.classList.remove("on"));if(was){pickedFab=null;}else{pickedFab=b.dataset.k;b.classList.add("on");}});
  $("#bk").onclick=viewDash;
  $("#go").onclick=async()=>{
    if(!pickedStyle) return msg(t("err_style"));
    if(!pickedGen) return msg(t("err_gen"));
    if(!pickedSea) return msg(t("err_season"));
    const age=parseInt($("#o_a").value,10);
    if(!(age>=1&&age<=100)) return msg(t("err_age"));
    const title=$("#o_t").value.trim(), description=$("#o_d").value.trim();
    const row={title,description,style:pickedStyle,gender:pickedGen,age,season:pickedSea,fabric:pickedFab};
    for(const [k] of MS){const v=parseFloat($("#m_"+k).value);if(!(v>0)) return msg(t("err_fill"));row[k]=v;}
    if(!title||!description) return msg(t("err_fill"));
    $("#go").disabled=true; msg(t("wait"),true);
    const rf=$("#o_ref").files[0];
    if(rf){try{const blob=await shrink(rf,1280,.8);const path=`${session.user.id}/${Date.now()}.jpg`;const {error:ue}=await sb.storage.from("refs").upload(path,blob,{contentType:"image/jpeg"});if(ue)throw ue;row.ref_image_url=sb.storage.from("refs").getPublicUrl(path).data.publicUrl;}catch(e){$("#go").disabled=false;return msg(t("err_ref"));}}
    const {error}=await sb.from("orders").insert(row);
    if(error){$("#go").disabled=false;return msg(error.message);}
    tab="orders"; viewDash();
  };
}

function viewSpecialties(){
  const sel=new Set(profile.specialties||[]);
  $("#app").innerHTML=`<h1>${t("sp_title")}</h1><p class="sub">${t("sp_sub")}</p>
   <div class="scs">${STY.map(k=>styCard(k,sel.has(k))).join("")}</div>
   <button class="btn" id="go">${t("save")}</button><div class="msg" id="msg"></div>
   ${sel.size?`<button class="link" id="bk">${t("o_back")}</button>`:""}`;
  document.querySelectorAll(".sc").forEach(b=>b.onclick=()=>{const k=b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle("on");});
  if($("#bk")) $("#bk").onclick=viewDash;
  $("#go").onclick=async()=>{
    if(!sel.size) return msg(t("err_spec"));
    $("#go").disabled=true; msg(t("wait"),true);
    const {error}=await sb.from("profiles").update({specialties:[...sel]}).eq("id",session.user.id);
    if(error){$("#go").disabled=false;return msg(error.message);}
    boot();
  };
}

const ICON={

 works:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 9"/>',
 profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
const TABS={client:[["home","tb_home"],["orders","tb_orders"],["ideas","tb_ideas"],["profile","tb_profile"]],
 other:[["home","tb_home"],["works","tb_works"],["profile","tb_profile"]]};

function renderNav(){
  const n=$("#nav"); n.hidden=false;
  n.innerHTML=TABS[profile.role==="client"?"client":"other"].map(([k,l])=>
    `<button data-k="${k}" class="${tab===k?"on":""}"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg><span>${t(l)}</span></button>`).join("");
  n.querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;viewDash();});
}

function viewDash(){
  const r=profile.role, sp=profile.specialties||[];
  if(r!=="client"&&!sp.length){$("#nav").hidden=true;return viewSpecialties();}
  if(!TABS[r==="client"?"client":"other"].some(x=>x[0]===tab)) tab="home";
  const hello=`<div class="hello"><h1></h1><span class="tag">${t(r)}</span></div>`;
  const chips=r==="client"?"":`<div class="chips" style="margin-bottom:6px">${sp.map(x=>`<span class="st">${t("sty_"+x)}</span>`).join("")}</div>`;
  let html="", after=null;
  if(tab==="home"){
    if(r==="client"){
      html=hero()+hello+`<button class="btn" id="new" style="margin:0 0 6px">${t("c1")}</button><h2>${t("my_last")}</h2><div id="list"></div>`;
      after=()=>{$("#new").onclick=viewNewOrder;loadOrders($("#list"),"empty_c",3);};
    } else {
      html=hero()+hello+chips+`<div id="list"></div>`;
      after=()=>loadWork($("#list"),r);
    }
  } else if(tab==="orders"){
    html=`<h1>${t("c2")}</h1><div id="list"></div>`; after=()=>loadOrders($("#list"),"empty_c");
  } else if(tab==="ideas") html=`<h1>${t("tb_ideas")}</h1><p class="sub">${t("ideas_d")}</p>`;
  else if(tab==="works") html=`<h1>${t("tb_works")}</h1><p class="sub">${t("works_d")}</p>`;
  else {
    html=hello+`<div class="item"><b>${t("email")}</b><span dir="ltr">${esc(session.user.email)}</span></div>`
      +(r==="client"?"":`<h2>${t("sp_title")}</h2>${chips}<button class="link" id="ed" style="margin:8px 0 0">${t("sp_edit")}</button>`)
      +(r==="client"?"":`<h2>${t("wal")}</h2><div id="wal"></div>`)
      +`<button class="btn alt" id="lo">${t("out")}</button>`;
    after=()=>{
      if($("#ed")) $("#ed").onclick=viewSpecialties;
      if($("#wal")) loadWallet($("#wal"));
      $("#lo").onclick=async()=>{await sb.auth.signOut();session=null;profile=null;tab="home";render();};
    };
  }
  $("#app").innerHTML=html;
  if($(".hello h1")) $(".hello h1").textContent=t("hello")+" "+profile.full_name;
  renderNav();
  if(after) after();
}

async function boot(){
  const {data}=await sb.auth.getSession(); session=data.session;
  if(recovering&&session) return viewNewPass();
  if(!session){profile=null;return render();}
  const {data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  profile=p; render();
}
function render(){
  $("#lang").textContent = lang==="ar"?"Français":"العربية";
  $("#out").hidden = true;
  if(!session){$("#nav").hidden=true;return viewAuth();}
  if(!profile){$("#nav").hidden=true;return viewRolePick();}
  viewDash();
}
setLang(lang); boot();
</script>
